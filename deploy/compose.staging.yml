# Staging overlay: mirrors production on an isolated host/volume set so the
# release gate, money proof, and backup/restore drill run against staging that
# mirrors production (roadmap Track 5). Smaller caps, shorter retention, and a
# staging-only image tag; never point it at the prod data volume.
#
#   cp .env.staging.example .env.staging   # copy .env.prod.example and change DOMAIN + tag
#   DOMAIN=staging.<MAXIMUS_DOMAIN> docker compose -f docker-compose.yml -f compose.staging.yml --env-file .env.staging up -d
name: ${COMPOSE_PROJECT_NAME:-maximus-staging}
services:
  maximus:
    image: ghcr.io/${RELEASE_OWNER:?set RELEASE_OWNER}/maximus:${MAXIMUS_VERSION:-staging}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MAXIMUS_PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      MAXIMUS_WEBHOOK_PUBLIC_URL: https://${DOMAIN:?set DOMAIN}

  caddy:
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      maximus:
        condition: service_healthy
    environment:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 4 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-3}
    volumes:
      - data:/data:ro
      - backups:/backups
      - ./backup/backup.sh:/scripts/backup.sh:ro
    command:
      - /bin/sh
      - -ec
      - |
        echo "$$BACKUP_SCHEDULE /scripts/backup.sh >>/var/log/backup.log 2>&1" | crontab -
        exec crond -f -l 8

volumes:
  backups:
