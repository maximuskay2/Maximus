name: ${COMPOSE_PROJECT_NAME:-maximus-podman}
services:
  maximus:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/maximus-podman:${MAXIMUS_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${MAXIMUS_DATA_ROOT:?Run setup.sh first}:${MAXIMUS_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/maximus-podman.sock
    environment:
      HOME: ${MAXIMUS_DATA_ROOT}
      MAXIMUS_DATA_DIR: ${MAXIMUS_DATA_ROOT}/.maximus
      MAXIMUS_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/maximus-podman.sock
      MAXIMUS_PORT: ${MAXIMUS_PORT:-8799}
      MAXIMUS_WEBHOOK_PORT: ${MAXIMUS_WEBHOOK_PORT:-8800}
      MAXIMUS_PUBLIC_URL: ${MAXIMUS_PUBLIC_URL:-http://localhost:8080}
      MAXIMUS_WEBHOOK_PUBLIC_URL: ${MAXIMUS_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$MAXIMUS_PORT/api/health | grep -q maximus']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      maximus:
        condition: service_healthy
    environment:
      MAXIMUS_HTTP_PORT: ${MAXIMUS_HTTP_PORT:-8080}
      MAXIMUS_PORT: ${MAXIMUS_PORT:-8799}
      MAXIMUS_WEBHOOK_PORT: ${MAXIMUS_WEBHOOK_PORT:-8800}
      MAXIMUS_HTTPS_HOST: ${MAXIMUS_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
