name: ${COMPOSE_PROJECT_NAME:-maximus}
services:
  maximus:
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${MAXIMUS_BASE_IMAGE:-ghcr.io/RELEASE_OWNER/maximus:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${MAXIMUS_LOCAL_IMAGE:-maximus-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${MAXIMUS_BIND_ADDRESS:-127.0.0.1}:${MAXIMUS_HTTP_PORT:-8080}:80"
    environment:
      MAXIMUS_PORT: "8799"
      MAXIMUS_WEBHOOK_PORT: "8800"
      MAXIMUS_PUBLIC_URL: ${MAXIMUS_PUBLIC_URL:-http://localhost:${MAXIMUS_HTTP_PORT:-8080}}
      MAXIMUS_WEBHOOK_PUBLIC_URL: ${MAXIMUS_WEBHOOK_PUBLIC_URL:-${MAXIMUS_PUBLIC_URL:-http://localhost:${MAXIMUS_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('maximus')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:maximus
    environment:
      MAXIMUS_HTTPS_HOST: ${MAXIMUS_HTTPS_HOST:-}
      MAXIMUS_BIND_ADDRESS: ${MAXIMUS_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export MAXIMUS_UPSTREAM_SCHEME=http
        if [ -n "$$MAXIMUS_HTTPS_HOST" ] && [ "$$MAXIMUS_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "MAXIMUS_HTTPS_HOST requires MAXIMUS_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$MAXIMUS_HTTPS_HOST" ]; then
          export MAXIMUS_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      maximus:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${MAXIMUS_DATA_EXTERNAL:-false}
    name: ${MAXIMUS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-maximus}_data}
  caddy_data:
  caddy_config:
