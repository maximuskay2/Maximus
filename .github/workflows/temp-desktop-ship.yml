# One-shot desktop ship for the temporary public build repo.
# - Windows: unsigned NSIS (no OV cert)
# - Linux: .deb + AppImage
# - macOS: Developer ID sign + notarize + staple (needs repo secrets)
#
# Delete this workflow with the temp repo after artifacts are downloaded.
name: Temp desktop ship

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify the packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/server/desktop-entry.mjs" ] || { echo "::error::missing desktop-entry.mjs"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          ls -lh release/*.exe release/*.yml
      - name: Browser smoke (best-effort)
        continue-on-error: true
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: Packaged server smoke
        env:
          MAXIMUS_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maximus-win-unsigned
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ubuntu x64 (.deb + AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm build:cua:linux
      - run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - run: pnpm package:linux:offline
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: node scripts/verify-linux-package.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maximus-linux
          path: |
            release/*.deb
            release/*.AppImage
            release/*.yml
          if-no-files-found: error
          retention-days: 7

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          test -n "$MAC_CERT_P12_BASE64" || { echo "::error::MAC_CERT_P12_BASE64 is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package both architectures
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm package:mac
      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          for app in release/mac-arm64/Maximus.app release/mac/Maximus.app; do
            codesign --verify --deep --strict "$app" || { echo "::error::invalid signature in $app"; exit 1; }
          done
      - name: "Gate: both packaged servers start"
        run: |
          for app in release/mac-arm64/Maximus.app release/mac/Maximus.app; do
            MAXIMUS_SMOKE_DIST="$app/Contents/Resources/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
          done
      - name: Notarize all artifacts
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_API_KEY_P8_BASE64" || { echo "::error::notarization secrets are not set"; exit 1; }
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg release/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"
      - name: Staple, re-zip, regenerate blockmaps and the feed
        run: |
          staple() {
            for attempt in 1 2 3 4 5 6; do
              xcrun stapler staple "$1" && return 0
              echo "stapling $1 failed (attempt $attempt of 6); trying again in 30 s"
              sleep 30
            done
            echo "::error::could not staple $1 after 6 attempts"
            return 1
          }
          for f in release/Maximus-*-arm64.dmg release/Maximus-*-x64.dmg release/mac-arm64/Maximus.app release/mac/Maximus.app; do
            staple "$f"
          done
          v=$(node -p "require('./package.json').version")
          rm -f "release/Maximus-$v-arm64.zip" "release/Maximus-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Maximus.app "release/Maximus-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/Maximus.app "release/Maximus-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/Maximus-$v-arm64.zip" "release/Maximus-$v-x64.zip" \
            "release/Maximus-$v-arm64.dmg" "release/Maximus-$v-x64.dmg"
          node scripts/regenerate-mac-feed.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maximus-mac-signed
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7
