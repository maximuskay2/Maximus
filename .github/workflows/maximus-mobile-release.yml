# Maximus mobile release pipeline (Phase 10): one tag ships both stores.
#
#   gate:  version sync check -> flutter analyze -> flutter test
#   build: iOS (sign + TestFlight) and Android (sign + Play internal) in
#          parallel, only after gate
#
# Triggers on maximus-mobile-v* tags and manual dispatch only, so a PR can
# never start a signed build. Uploads go to TestFlight (internal) and the
# Play internal track; promoting to production stays a manual store action.
#
# Required repo secrets (placeholder names — values live with the owner,
# never in the repo; same convention as maximus-release.yml):
#   MAXIMUS_APPLE_TEAM_ID — App Store Connect team id
#   MAXIMUS_IOS_DIST_P12_BASE64 / MAXIMUS_IOS_DIST_P12_PASSWORD — Apple
#     Distribution certificate (covers the app + LiveActivities extension)
#   MAXIMUS_IOS_PROFILE_BASE64 — app provisioning profile (com.maximus.app)
#   MAXIMUS_IOS_ACTIVITY_PROFILE_BASE64 — extension profile
#     (com.maximus.app.LiveActivities)
#   MAXIMUS_IOS_PROFILE_NAME / MAXIMUS_IOS_ACTIVITY_PROFILE_NAME — profile
#     names matching ExportOptions.plist
#   MAXIMUS_ASC_API_KEY_JSON — App Store Connect API key (TestFlight upload)
#   MAXIMUS_GOOGLE_SERVICE_PLIST_BASE64 — GoogleService-Info.plist (FCM/APNs)
#   MAXIMUS_ANDROID_KEYSTORE_BASE64 / MAXIMUS_ANDROID_KEYSTORE_PASSWORD /
#     MAXIMUS_ANDROID_KEY_ALIAS / MAXIMUS_ANDROID_KEY_PASSWORD — Play
#     upload key
#   MAXIMUS_PLAY_SERVICE_ACCOUNT_JSON — Play Console service account
#     (internal-track upload)
#   MAXIMUS_GOOGLE_SERVICES_JSON_BASE64 — google-services.json (FCM)
name: Maximus mobile release

on:
  push:
    tags:
      - "maximus-mobile-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: version, analyze, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
      - name: version sync check (pubspec tracks package.json)
        run: dart tool/sync_version.dart --check
        working-directory: mobile
      - name: analyze
        run: flutter analyze
        working-directory: mobile
      - name: tests
        run: flutter test test/
        working-directory: mobile

  ios:
    name: iOS sign + TestFlight
    needs: gate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
      - name: stamp build number from the run
        run: dart tool/sync_version.dart --build ${{ github.run_number }}
        working-directory: mobile
      - name: install distribution certificate
        env:
          P12_BASE64: ${{ secrets.MAXIMUS_IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAXIMUS_IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/maximus-mobile.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security list-keychains -s "$KEYCHAIN" \
            "$HOME/Library/Keychains/login.keychain-db"
          shred -u "$RUNNER_TEMP/dist.p12" || rm -f "$RUNNER_TEMP/dist.p12"
      - name: install provisioning profiles + FCM config
        env:
          APP_PROFILE: ${{ secrets.MAXIMUS_IOS_PROFILE_BASE64 }}
          ACTIVITY_PROFILE: ${{ secrets.MAXIMUS_IOS_ACTIVITY_PROFILE_BASE64 }}
          GPLIST: ${{ secrets.MAXIMUS_GOOGLE_SERVICE_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APP_PROFILE" | base64 --decode > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"
          echo "$ACTIVITY_PROFILE" | base64 --decode > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/activity.mobileprovision"
          echo "$GPLIST" | base64 --decode > \
            mobile/ios/Runner/GoogleService-Info.plist
      - name: build signed ipa
        env:
          MAXIMUS_APPLE_TEAM_ID: ${{ secrets.MAXIMUS_APPLE_TEAM_ID }}
          MAXIMUS_IOS_PROFILE_NAME: ${{ secrets.MAXIMUS_IOS_PROFILE_NAME }}
          MAXIMUS_IOS_ACTIVITY_PROFILE_NAME: ${{ secrets.MAXIMUS_IOS_ACTIVITY_PROFILE_NAME }}
        run: >
          flutter build ipa --release
          --export-options-plist=ios/ExportOptions.plist
        working-directory: mobile
      - name: upload to TestFlight
        env:
          ASC_KEY_JSON: ${{ secrets.MAXIMUS_ASC_API_KEY_JSON }}
        run: |
          set -euo pipefail
          gem install fastlane -N >/dev/null
          echo "$ASC_KEY_JSON" > "$RUNNER_TEMP/asc_key.json"
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --ipa mobile/build/ios/ipa/*.ipa \
            --distribute_external false \
            --skip_waiting_for_build_processing true
          shred -u "$RUNNER_TEMP/asc_key.json" || rm -f "$RUNNER_TEMP/asc_key.json"

  android:
    name: Android sign + Play internal
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
      - name: stamp build number from the run
        run: dart tool/sync_version.dart --build ${{ github.run_number }}
        working-directory: mobile
      - name: write upload key + FCM config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MAXIMUS_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAXIMUS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAXIMUS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAXIMUS_ANDROID_KEY_PASSWORD }}
          GSERVICES: ${{ secrets.MAXIMUS_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > \
            "$RUNNER_TEMP/upload.jks"
          cat > mobile/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF
          echo "$GSERVICES" | base64 --decode > \
            mobile/android/app/google-services.json
      - name: build signed appbundle
        run: flutter build appbundle --release
        working-directory: mobile
      - name: upload to Play internal track
        env:
          PLAY_JSON: ${{ secrets.MAXIMUS_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          gem install fastlane -N >/dev/null
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          fastlane supply \
            --json_key "$RUNNER_TEMP/play.json" \
            --aab mobile/build/app/outputs/bundle/release/app-release.aab \
            --track internal
          shred -u "$RUNNER_TEMP/play.json" || rm -f "$RUNNER_TEMP/play.json"
