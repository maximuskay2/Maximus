# Maximus release pipeline (Track 5): one tag builds every signed installer.
#
#   gate:  typecheck -> lint -> full tests (vitest + broker + electron + packaged server)
#   build: macOS (arm64 + x64, sign + notarize + staple), Windows (OV-sign),
#          Ubuntu (.deb + AppImage + checksums) — in parallel, only after gate
#   feed:  assemble a draft release on this repo with verified updater feeds
#
# Triggers on maximus-v* tags and manual dispatch only, so a PR can never start
# a signed build. Publishing is manual: review the draft, then publish it.
#
# Required repo secrets (placeholder names — values live with the owner, never
# in the repo; see docs/secret-rotation.md and contracts s8):
#   MAXIMUS_MAC_CERT_P12_BASE64 / MAXIMUS_MAC_CERT_PASSWORD — Developer ID cert
#   MAXIMUS_APPLE_API_KEY_P8_BASE64 / MAXIMUS_APPLE_API_KEY_ID /
#     MAXIMUS_APPLE_API_ISSUER_ID — notarization API key
#   MAXIMUS_WIN_CERT_PFX_BASE64 / MAXIMUS_WIN_CERT_PASSWORD — OV code-sign cert
# The updater feed is this repo's releases (electron-builder publish target);
# no feed token is needed for public releases. A private mirror would add
# MAXIMUS_UPDATE_FEED_TOKEN (gh release upload to the mirror repo).
name: Maximus release

on:
  push:
    tags:
      - "maximus-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: typecheck, lint, full tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm exec oxlint --deny-warnings .
      - name: full tests (vitest + broker + electron + packaged server)
        run: pnpm test

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    needs: gate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAXIMUS_MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAXIMUS_MAC_CERT_PASSWORD }}
        run: |
          test -n "$MAC_CERT_P12_BASE64" || { echo "::error::MAXIMUS_MAC_CERT_P12_BASE64 is not set (contracts s8)"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package both architectures
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm package:mac
      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          for app in release/mac-arm64/Maximus.app release/mac/Maximus.app; do
            codesign --verify --deep --strict "$app" || { echo "::error::invalid signature in $app"; exit 1; }
          done
      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/Maximus.app release/mac/Maximus.app; do
            MAXIMUS_SMOKE_DIST="$app/Contents/Resources/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
          done
      - name: Notarize all four artifacts
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.MAXIMUS_APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.MAXIMUS_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.MAXIMUS_APPLE_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_API_KEY_P8_BASE64" || { echo "::error::notarization secrets are not set (contracts s8)"; exit 1; }
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg release/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"
      - name: Staple, re-zip, regenerate blockmaps and the feed
        run: |
          staple() {
            for attempt in 1 2 3 4 5 6; do
              xcrun stapler staple "$1" && return 0
              echo "stapling $1 failed (attempt $attempt of 6); trying again in 30 s"
              sleep 30
            done
            echo "::error::could not staple $1 after 6 attempts"
            return 1
          }
          for f in release/Maximus-*-arm64.dmg release/Maximus-*-x64.dmg release/mac-arm64/Maximus.app release/mac/Maximus.app; do
            staple "$f"
          done
          v=$(node -p "require('./package.json').version")
          rm -f "release/Maximus-$v-arm64.zip" "release/Maximus-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Maximus.app "release/Maximus-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/Maximus.app "release/Maximus-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/Maximus-$v-arm64.zip" "release/Maximus-$v-x64.zip" \
            "release/Maximus-$v-arm64.dmg" "release/Maximus-$v-x64.dmg"
          # refreshes every hash from the post-staple bytes and refuses to
          # finish unless the feed matches the files on disk
          node scripts/regenerate-mac-feed.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maximus-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  win:
    name: Windows x64 (OV-sign)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: Remove-Item -Recurse -Force dist, dist-server, dist-native, release -ErrorAction SilentlyContinue
      - name: Package and sign
        env:
          CSC_LINK: ${{ secrets.MAXIMUS_WIN_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAXIMUS_WIN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) { Write-Error "MAXIMUS_WIN_CERT_PFX_BASE64 is not set (contracts s8)"; exit 1 }
          pnpm package:win
      - name: "Gate: the installer is signed and the feed exists"
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no installer in release/"; exit 1 }
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne "Valid") { Write-Error "$($exe.Name) signature is $($sig.Status)"; exit 1 }
          if (-not (Test-Path release/latest.yml)) { Write-Error "release/latest.yml is missing — Windows installs would strand"; exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maximus-win
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Ubuntu x64 (.deb + AppImage)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - run: pnpm package:linux
      - name: "Gate: both artifacts exist and the packaged server starts"
        run: |
          ls release/*.deb release/*.AppImage
          MAXIMUS_SMOKE_DIST="$PWD/release/linux-unpacked/resources/server" node scripts/smoke-packaged-server.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maximus-linux
          path: |
            release/*.deb
            release/*.AppImage
            release/*.yml
          if-no-files-found: error
          retention-days: 30

  feed:
    name: Assemble the draft release with verified feeds
    needs: [mac, win, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: "Gate: every platform shipped and both updater feeds exist"
        run: |
          ls artifacts/maximus-mac/*.dmg artifacts/maximus-win/*.exe artifacts/maximus-linux/*.deb
          test -f artifacts/maximus-mac/latest-mac.yml || { echo "::error::latest-mac.yml missing — macOS installs would strand"; exit 1; }
          test -f artifacts/maximus-win/latest.yml || { echo "::error::latest.yml missing — Windows installs would strand"; exit 1; }
          (cd artifacts && sha256sum maximus-*/* > ../SHA256SUMS)
          cat SHA256SUMS
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in maximus-v*) ;; *) tag="maximus-v$(node -p "require('./package.json').version" 2>/dev/null || echo 0.0.0)" ;; esac
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$tag is already published — bump the version first"
            exit 1
          fi
          flags="--draft --title $tag --notes 'Draft for review. Publish only after the release-gate matrix passes on staging that mirrors production.'"
          if [ "$PUBLISH" = "true" ]; then flags="--title $tag"; fi
          # shellcheck disable=SC2086
          gh release create "$tag" $flags artifacts/maximus-mac/* artifacts/maximus-win/* artifacts/maximus-linux/* SHA256SUMS 2>/dev/null \
            || gh release upload "$tag" artifacts/maximus-mac/* artifacts/maximus-win/* artifacts/maximus-linux/* SHA256SUMS --clobber
